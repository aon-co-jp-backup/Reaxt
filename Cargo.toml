[package]
name = "reaxt"
description = "Reaxt: Rust-only full-stack framework (React/Next/Nuxt/Nest ideas) for RPoem + SET. Hybrid SSR/CSR/Islands per route."
version = "0.0.1"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/aon-co-jp/Reaxt"

[lints.rust]
unsafe_code = "deny"

[dependencies]
rhtml5 = { git = "https://github.com/aon-co-jp/RS-HTML", optional = true }
rcss3 = { git = "https://github.com/aon-co-jp/RS-CSS", optional = true }

[features]
# RS-HTML/RS-CSSのDOM木とVNodeを接続(RS-Reactから引き継いだ任意機能)
dom_bridge = ["dep:rhtml5", "dep:rcss3"]
