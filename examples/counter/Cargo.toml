[package]
name = "reaxt-counter"
description = "Reaxt ハイドレーションの実例(カウンター)。wasm32向け。"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0 OR MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
reaxt = { path = "../.." }
reaxt-actions = { path = "../../reaxt-actions" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.126"
web-sys = { version = "0.3", features = ["Window", "Location", "Document", "Element", "HtmlElement", "Node"] }
