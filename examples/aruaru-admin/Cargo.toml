[package]
name = "aruaru-admin-reaxt"
description = "aruaru-admin Web を Reaxt(Rustのみ)へ移植する実験。wasm32向け。"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0 OR MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
reaxt = { path = "../.." }
reaxt-actions = { path = "../../reaxt-actions" }
rust-json = { path = "../../../RS-JSON" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.126"
