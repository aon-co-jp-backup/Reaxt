[package]
name = "reaxt-counter"
description = "Reaxt ハイドレーションの実例(カウンター)。wasm32向け。"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0 OR MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
reaxt = { path = "../.." }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.126"
